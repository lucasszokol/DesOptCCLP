name: Project 4 verification and Pages
on:
  push:
    branches: [main]
    paths: ["Project4/**", ".github/workflows/project4-pages.yml"]
  pull_request:
    branches: [main]
    paths: ["Project4/**", ".github/workflows/project4-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r Project4/requirements-project4.txt
      - run: python -m pytest Project4/tests -q
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r Project4/requirements-project4.txt
      - uses: actions/configure-pages@v5
      - run: python -m Project4.heatsink.site --source Project4/site
      - uses: actions/upload-pages-artifact@v3
        with: {path: ./Project4/site/_site}
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
